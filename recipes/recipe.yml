name: bluefin-dx-displaylink
description: Bluefin DX avec pilote DisplayLink (evdi)

base-image: ghcr.io/ublue-os/bluefin-dx
image-version: stable   # ou gts, selon le canal que tu utilises déjà

modules:
  # 1. Dépôt negativo17 : nécessaire pour les dépendances de l'akmod evdi
  - type: dnf
    repos:
      files:
        - https://negativo17.org/repos/fedora-multimedia.repo

  # 2. Module noyau evdi (préconstruit et signé par Universal Blue)
  - type: akmods
    base: main
    install:
      - evdi

  # 3. Partie userspace de DisplayLink
  - type: dnf
    install:
      packages:
        - displaylink

  - type: signing
